message_templates:
  seema:
    channel: "iNaturalist既存スレッド"
    objective: "8月8・9日の訪問と持参UV許可を確定"
    text: |-
      Hello Seema,

      Thank you very much for your warm invitation and for introducing us to Anand and Misty Views. I apologize for taking some time to finalize our route.

      We are now planning to stay at Misty Views for two nights, checking in on 8 August and checking out on 10 August. There will be two of us. Would the evenings of 8 and 9 August be convenient for visiting Serenity Garden? We would be especially happy to meet you while you are there.

      Observing the white wall and the CFL that is always on already sounds excellent. May I also ask whether you would permit us to operate our own insect-attracting UV light with a white sheet for two or three hours after dark at a safe place that you choose within the property? We would follow any conditions you set and use it only for observation and photography. We will not collect, handle, harm, or remove any insects.

      We will contact Anand directly about the room, meals, and transport. If the dates above work for you, we would be very grateful to confirm the visit.

      Warm regards,
      Takuma Uno

  anand:
    channel: "WhatsApp、返事がなければ電話"
    phone_primary: "+91 9961148279"
    phone_secondary: "+91 9986541469"
    objective: "部屋、料金、食事、同行、COK送迎、夜行bus乗車地までの車を確定"
    text: |-
      Hello Mr Anand,

      My name is Takuma Uno, a naturalist from Japan. Ms Seema Merchant kindly gave me your contact and recommended Misty Views because we hope to observe and photograph nocturnal insects at Serenity Garden with her permission.

      We are two adults and would like to ask whether you have a room available for two nights, checking in on 8 August and checking out on 10 August 2026.

      Could you please let us know:
      1. the total room rate for two people for two nights;
      2. whether breakfast and dinner are available or included;
      3. whether you could escort us between Misty Views and Serenity Garden after dark on 8 and/or 9 August, as Seema mentioned;
      4. whether you could arrange a pick-up from Kochi Airport on 8 August, or recommend the best taxi arrangement, and the approximate cost;
      5. whether we could leave our luggage after check-out on 10 August and arrange a taxi to the Kumily or Kattappana bus departure point around 15:30, as we may take an overnight bus toward Kannur and Kodagu.

      Our activity is strictly non-collecting observation and photography. We will not catch, handle, harm, or remove any insects. We are separately confirming with Seema whether we may use our own UV insect light and white sheet at a place she designates.

      As our departure from Japan is very soon, an availability and price confirmation would be greatly appreciated.

      Thank you,
      Takuma Uno

  honey_valley:
    channel: "WhatsApp/SMS、返事がなければ電話"
    phone: "+91 8197444939"
    objective: "本命4泊拠点として必要な全条件を宿自身から確定"
    text: |-
      Hello,

      My name is Takuma Uno, a naturalist visiting from Japan. Mr Suresh and another Indian naturalist, Ashwin, recommended Honey Valley to me. Ashwin has personally observed Odontolabis stag beetles in the Honey Valley area, including beetles attracted to insect lights.

      We are two adults and are considering a four-night stay from 11 August to 15 August 2026. Before confirming, may I check the following practical points?

      1. Do you have a room available for two people for those four nights?
      2. What is the total price, and which meals are included?
      3. With the owner's explicit permission, may we use our own insect-attracting UV light and a white sheet for two or three hours after dark at a safe place designated by Honey Valley?
      4. Our purpose is observation and photography only. We will not collect, catch, handle, harm, or remove any insects. Is this acceptable?
      5. Is a suitable electricity point available, or should our light be completely battery powered?
      6. Could a staff member or local naturalist help us choose the safe location and accompany us initially at night? If there is a fee, please let us know.
      7. Where is the current 4WD pick-up point, what is the transfer charge, and could you collect us around midday on 11 August after we arrive from Kannur?
      8. What is the earliest 4WD transfer down on 15 August, and could you help arrange onward transport to Mangaluru Airport for an afternoon flight to Mumbai?

      We understand that no beetle sighting can be guaranteed. The important points for us are the owner's clear permission, a safe place for the light and sheet, and the transport arrangements.

      As we leave Japan on 7 August, we would be very grateful for a direct answer as soon as possible, even if this arrangement is not possible.

      Thank you very much,
      Takuma Uno
      WhatsApp: +81 70 8973 2891
    short_phone_version: |-
      Two adults, four nights, 11 to 15 August.
      Is a room available, and what is the total price with meals?
      Does the owner permit our own UV insect light and white sheet for photography only, with no collecting?
      Can your 4WD collect us around midday on 11 August after we arrive from Kannur?
      What is your earliest down transfer on 15 August, and can you arrange transport to Mangaluru Airport?

  iiser_observers:
    channel: "iNaturalist、各人へ個別送信"
    common_objective: "発見方法、host、既存灯の夜間同行、正式入構を確定"
    base_text: |-
      Hello NAME,

      I am a naturalist from Japan visiting Kerala with one friend in August. I saw your excellent SPECIES observation at IISER TVM from DATE:
      URL

      Our purpose is strictly observation, photography, and iNaturalist documentation. We will not collect, catch, handle, harm, or remove any insects.

      May I ask whether this beetle was found near an existing outdoor light or building light on campus? We may be near Vithura between 13 and 15 August 2026. Would you, or another student interested in insects, possibly be willing to host and accompany two visitors for a short walk around existing lights, for example from about 19:00 to 21:30 on one evening?

      We would follow all campus visitor and security procedures. We would not bring or operate any UV equipment unless the institute explicitly authorized it; checking existing lights would be sufficient.

      If you are unavailable, an introduction to another observer, Proteus Biology Club, or the appropriate institute contact would be extremely helpful. We understand completely if a visit cannot be arranged.

      Thank you very much,
      Takuma Uno
    substitutions:
      - "Parth / Odontolabis versicolor / 11 August 2025 / https://www.inaturalist.org/observations/306956143"
      - "Ananya / Prosopocoilus giraffa nilgirensis / 11 August 2025 / https://www.inaturalist.org/observations/305559036"
      - "Rushikesh / Odontolabis versicolor / 27 May 2025 / https://www.inaturalist.org/observations/285631396"

  iiser_outreach:
    channel: "email"
    to: "outreach@iisertvm.ac.in"
    subject: "Request for a short hosted nocturnal insect observation visit"
    use_if: "観察者から反応がない場合"
    text: |-
      Dear Outreach Team,

      I am a naturalist from Japan visiting Kerala with one companion in August. We are interested in non-collecting observation and photography of nocturnal insects. We noticed several public iNaturalist records of large stag beetles from the IISER TVM campus, including Odontolabis versicolor recorded on 11 August 2025.

      We may be near Vithura between 13 and 15 August 2026. Would it be possible to arrange a short, hosted visit on one evening, approximately 19:00 to 21:30, to observe insects around existing outdoor lights? We would not collect, catch, handle, harm, or remove any wildlife. We would not use any additional light equipment unless explicitly authorized.

      We would fully follow the institute's visitor registration, identification, security, and host requirements. If this request should be directed to a faculty member, student nature group, or another office, we would be grateful if you could advise us.

      There will be two visitors: Takuma Uno and one companion, both travelling from Japan.

      As our travel begins on 7 August, a reply at your earliest convenience would be greatly appreciated. We understand if a visit cannot be accommodated.

      Best regards,
      Takuma Uno

