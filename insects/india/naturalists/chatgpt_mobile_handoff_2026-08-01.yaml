    北へ無理に移動せず、Serenity＋Periyar公式night walk＋owner許可を得た森林系私有宿からTRVへ抜ける。
  decision_deadline: "2026-08-02 夜（内部締切）"

latest_reassessment_2026_08_01:
  source_document: "直接記録と訪問順序の再評価_2026-08-01.md"
  main_correction: >-
    Fringe Ford側とWhatsAppのKodagu naturalist（末尾2934）は、候補地におけるOdontolabisの
    直接実見記録を持っていない。対象種根拠としての優先順位は下げ、許可済み私有地、宿、
    夜間安全、同行者を成立させる手配者として評価する。
  exception_ashwin: >-
    AshwinはHoney ValleyでOdontolabisを見たと明言し、灯火スクリーンへの飛来経験もある。
    ただしprofessional guideでもownerでもなく、正確な灯火場所と許可主体への追加質問は未回答。
  evidence_classes:
    exact_public_observation_sites:
      - "Serenity Garden: 同一狭域3件、2種、複数年。ただし同一地点の8月記録は未確認"
      - "IISER TVM: 同一キャンパスで2025-08-11のO. versicolor等。季節一致が最強"
    named_locality_evidence:
      - >-
        Lower Nadugani / Gudalur側: 標本産地・飼育流通ラベル等の具体産地情報。
        Garden/IISERのような訪問可能な狭域の公開写真記録と同じ証拠レベルではない。
    personal_sighting_plus_weak_public_record:
      - "Honey Valley: Ashwin実見、12月の損傷個体公開記録、近隣Naladiの10月生体記録"
    execution_only_without_direct_target_record:
      - "Fringe Ford"
      - "Magnolia Resort"
      - "Meriyanda Nature Retreat"
  current_overall_priority:
    - "1. Serenity Garden: 記録、既設灯、owner歓迎、Anand同行候補が揃う"
    - "2. IISER: 生物学的根拠は最強だがhost確定前は実行不可"
    - "3. Lower Nadugani: 産地根拠はあるが宿・owner・合法な灯火地点なし"
    - "4. Honey Valley: Ashwin実見はあるが宿の直接許可・方法・4WD未確定"
    - "5. Fringe Ford: 実施体制は強いが対象種の直接根拠なし"
  garden_owner_presence:
    facts:
      - "Seemaは8月10日までGardenにいる"
      - "Seema本人が、不在時はMisty ViewsのAnandがGardenへ同行できると明記"
      - "白壁と常時点灯CFLの観察を歓迎"
    interpretation: >-
      owner本人の在不在は、既設CFL観察の絶対条件ではなさそう。ただし8月10日以降の
      Anand同行アクセスと、Seema不在中の持参UV使用は明示確認が必要。
    whatsapp_owner_warning: >-
      Kodagu naturalistの「owner will have no problem permitting the light」はGardenの話ではない。
      Honey Valley等3施設を提案した流れで、どのownerかも曖昧。Gardenの根拠はSeema本人の別返信。
  route_order_rule:
    if_garden_access_after_august_10_is_confirmed_and_lower_nadugani_permission_exists: >-
      地理順で CJB → Lower Nadugani 2夜 → Serenity Garden 2夜 → IISER 2夜 → TRV。
      8/10のLower Nadugani→Gardenは約337kmで終日移動、同夜は有効観察夜に数えない。
    if_garden_must_be_visited_by_august_10: >-
      Gardenを8/8〜9に置き、その後Periyar/IISERへ南下する。Lower Naduganiは原則外す。
      Garden→Lower Nadugani→IISERは北上と再南下になり、観察夜を失う。
    if_lower_nadugani_has_no_permitted_private_base: >-
      産地情報だけで2夜使わず、Gardenを8/8〜10に固定して南下する。
  immediate_single_question_to_seema: |-
    Hello Seema,

    Thank you again. Before we finalize the geographical order of our route, may I confirm one point?

    If we visit after 10 August, would it still be permitted for Anand to escort us to Serenity Garden after dark to observe the always-on CFL and white wall? Also, would your permission to use our own UV light and white sheet at a place you designate still apply while you are away, or should we use only the existing CFL?

    If visiting while you are present is important, we will arrange our route to come before 10 August. If Anand can escort us after the 10th, we can follow a more direct north-to-south route.

    Thank you very much,
    Takuma Uno

