handoff:
  schema_version: "1.0"
  created_at: "2026-08-01"
  timezone: "Asia/Tokyo"
  language: "Japanese"
  purpose: >-
    スマホ版ChatGPTへ、南インドOdontolabis観察遠征の検討状況を詳細に引き継ぎ、
    残り数回の連絡で8月8日から15日の宿泊地、泊数、国内線、地上交通を決定する。
  instruction_to_next_chatgpt: >-
    以下のstatus、evidence、decision_rulesを事実として引き継ぐこと。
    地名の印象だけでルートを作らず、対象種根拠、合法な夜間アクセス、実際の観察夜数、
    モンスーン期の交通を分けて評価すること。未確認事項を確認済みと扱わないこと。

