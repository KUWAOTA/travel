research_and_projects:
  VR_underwater_research:
    title: "水中自己位置推定を用いた没入型VR体験の基盤技術"
    period: "2020-2022 (大学院)"
    background: >
      ・アニメのように“空を浮遊する”体験をVRで叶えたい、という個人の夢・好奇心が原点。
      ・水中の浮力を使えば現実の重力から解放されたような没入感を得やすいと着想。
    theme: >
      ・そのための要素技術＝水中での自己位置推定、特にスマホ単体での実現。
      ・現実応用（例：水中ドローン、ロボット）にも拡張できる社会的意義。
    challenge:
      - "最大の課題は水中での『正解データ』取得。光の屈折のためカメラ＋カルマンフィルタをそのまま適用できず。"
      - "既存の陸上アルゴリズムを流用できない。"
    solution:
      - "防水スマホにモーショントラッカーを取り付け、陸上部分のデータで水中位置を間接推定"
      - "自分で何度も泳ぎ、泥臭く現場実験・データ収集を遂行"
      - "データ処理・解析はPython(Numpy/Scipy/Matplotlib/OpenCV)"
      - "アルゴリズム自体は既存流用だが、運用面の課題に現場で粘り強く挑戦"
    outcomes:
      - "現場の課題解決力と現実志向（理想だけでなく、使える解を重視）"
      - "現場実験・泥臭いアプローチへの粘り強さ"
      - "データ解析～運用を一人で完結"
      - "研究方針で教授と対立時も柔軟な合意形成"
    skills: [Python, 実験設計, データ解析, センサフュージョン]
    context:
      - "UnityによるVR可視化は最優先でなく、まず基礎技術優先"
      - "社会実装志向と好奇心・夢を両立したテーマ選択"
      - "工程開発・現場経験（工場実習半年）も今のCanで活用"

  VR_contest:
    title: "くすぐってみ～な（国際VRコンテスト入賞、ITmedia掲載）"
    year: "大学院"
    summary: >
      ・空気圧手袋で“他人からくすぐられている感覚”を再現するVRデバイス
      ・4人チーム。自分はHW設計・選定/サーバ制御担当
    challenge:
      - "くすぐったい感覚の再現に試行錯誤"
      - "短納期、PoCサイクル高速化、HW-SW連携"
    outcomes:
      - "PoCを高速に回す、検証を重視する姿勢"
      - "技術と発想力で新体験を創出"
    skills: [VR, Unity, HW設計, チーム開発, プロトタイピング]

  Akatsuki_GameJam:
    title: "アカツキGameJam優勝作品：AddSlime"
    year: "2020"
    summary: >
      ・3人チームでアクションゲームを2日間で制作
      ・自分はエフェクト担当
      ・コンセプト早期決定、コミュニケーション重視、ロジックをチームで分担
    challenge:
      - "短期間で完成度を上げるため、幅優先・迅速に実装"
      - "コンフリクトを避けるタスク分担"
    outcomes:
      - "完成度・プレイ体験重視の工夫"
      - "短期集中・チーム開発力"

  hobby_unity_ar:
    title: "命の輝きくんAR"
    summary: >
      ・Androidスマホで命の輝きくんが浮遊し、目からレーザー発射するゲームを一人で開発
      ・Unity、AR技術への親しみ
    outcomes: [独自企画、個人開発、技術探究]

  communication:
    - "京都大学在学時、留学生向け国際交流ワークショップ（ボランティア）参加。英語でのコミュニケーション実践"
    - "現職で非IT部門・品証部門など他職種と定期的に要件調整。立場や専門性の異なる相手と協力推進"
    - "リーダー経験：ネット上企画の運営（詳細は面接時に調整）、後輩の就活相談、塾講師バイトなど"

