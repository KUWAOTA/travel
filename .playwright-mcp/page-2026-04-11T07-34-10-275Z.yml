              - paragraph [ref=e272]:
                - superscript [ref=e273]: "1"
                - text: エクアドルのBanco Pichinchaの口座保有者に送金する場合、即時送金が可能です。サービスおよび資金の遅延または利用可否は、さまざまな要因によって異なります。たとえば、選択したサービス、遅延配送オプションの選択、送金額、送金先国、利用できる通貨、規制上の問題、消費者保護の問題、本人確認の要件、配送制限、取扱店の営業時間、およびタイムゾーンの違い（まとめて「制約」）などです。追加の制限が適用されることがあります。詳細は、注意事項と約款を参照してください。
              - paragraph [ref=e275]:
                - superscript [ref=e276]: "2"
                - text: また、Western Unionは、通貨換算によって利益を得ています。送金サービスを選択する際には、送金手数料と換算レートの両方を慎重に比較検討してください。手数料、外貨換算レート、および税は、様々な要因によってブランド、チャネル、および店舗ごとに異なります。手数料と換算レートは予告なく変更される場合があります。
              - paragraph [ref=e278]:
                - superscript [ref=e279]: "4"
                - text: 銀行によっては、国内送金または海外送金に手数料がかかります。ご利用の銀行にご確認ください。
              - paragraph [ref=e281]:
                - superscript [ref=e282]: "8"
                - text: 受取銀行の休業日を除きます。
              - paragraph [ref=e284]:
                - superscript [ref=e285]: "10"
                - text: 銀行口座情報の提供は慎重に行ってください。資金はご利用者が提供する口座番号の銀行口座に支払われます。注：受取人の口座は現地通貨支払口座である必要があります。
              - paragraph [ref=e287]:
                - superscript [ref=e288]: "12"
                - text: 通常、資金はWestern Unionの銀行口座に入金後3～5営業日以内に受取人の銀行口座へ入金されます
