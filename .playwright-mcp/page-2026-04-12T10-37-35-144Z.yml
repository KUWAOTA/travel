              - paragraph [ref=e776]:
                - superscript [ref=e777]: "1"
                - text: サービスおよび資金の遅延または利用可否は、さまざまな要因によって異なります。たとえば、選択したサービス、遅延配送オプションの選択、送金額、送金先国、利用できる通貨、規制上の問題、消費者保護の問題、本人確認の要件、配送制限、取扱店の営業時間、およびタイムゾーンの違い（まとめて「制約」）などです。追加の制限が適用されることがあります。詳細は、注意事項と約款を参照してください。
              - paragraph [ref=e520]:
                - superscript [ref=e521]: "2"
                - text: また、Western Unionは、通貨換算によって利益を得ています。送金サービスを選択する際には、送金手数料と換算レートの両方を慎重に比較検討してください。手数料、外貨換算レート、および税は、様々な要因によってブランド、チャネル、および店舗ごとに異なります。手数料と換算レートは予告なく変更される場合があります。
              - paragraph [ref=e523]:
                - superscript [ref=e524]: "4"
                - text: 銀行によっては、国内送金または海外送金に手数料がかかります。ご利用の銀行にご確認ください。
              - paragraph [ref=e779]:
                - superscript [ref=e780]: "5"
                - generic [ref=e781]:
                  - text: 上記の送金手数料の見積は、本日付けのオンライン取引に対する計算額です。取扱店の手数料はオンライン手数料とは異なる場合があります。お近くの取扱店を探して手数料の見積を入手するには、
                  - link "こちらをクリック" [ref=e782] [cursor=pointer]:
                    - /url: "http://locations.westernunion.com/search/{{ countryCode }}"
                  - text: してください。
              - paragraph [ref=e784]:
                - superscript [ref=e785]: "6"
                - text: 受取人は、 エクアドル 内のどの取扱店でも送金を受け取ることができます。
